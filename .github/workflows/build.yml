name: Build & Publish Docker Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Manual tag (default: dev-test)"
        required: false
        default: "dev-test"

jobs:
  build:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract API image metadata
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/smart-dacha-backend
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag_override }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          build-args: |
            RELEASE_VERSION=${{ steps.meta_api.outputs.version }}

      - name: Extract Backup image metadata
        id: meta_backup
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/smart-dacha-backup
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag_override }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Backup image
        uses: docker/build-push-action@v5
        with:
          context: ./backup
          file: ./backup/Dockerfile
          push: true
          tags: ${{ steps.meta_backup.outputs.tags }}
          labels: ${{ steps.meta_backup.outputs.labels }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      - name: Summary
        run: |
          echo "## Built images" >> $GITHUB_STEP_SUMMARY
          echo "- API: `${{ steps.meta_api.outputs.tags }}`" >> $GITHUB_STEP_SUMMARY
          echo "- Backup: `${{ steps.meta_backup.outputs.tags }}`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Trigger deploy: Actions -> Deploy to VPS -> Run workflow" >> $GITHUB_STEP_SUMMARY
